services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mimotrust
      POSTGRES_USER: mimotrust
      POSTGRES_PASSWORD: mimotrust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimotrust"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mimotrust
      MINIO_ROOT_PASSWORD: mimotrust-secret
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build: .
    env_file: .env
    environment: &backend-environment
      MIMO_JOB_MODE: distributed
      DATABASE_URL: postgresql+asyncpg://mimotrust:mimotrust@postgres:5432/mimotrust
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: mimotrust
      S3_SECRET_KEY: mimotrust-secret
      S3_BUCKET: mimotrust-artifacts
    ports:
      - "8000:8000"
    volumes:
      - trust-data:/srv/mimotrust/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build: .
    command: arq app.jobs.worker.WorkerSettings
    env_file: .env
    environment: *backend-environment
    volumes:
      - trust-data:/srv/mimotrust/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  trust-data:

