[project]
name = "mimo-video-summary-demo"
version = "0.6.0"
description = "Low-cost multimodal information extraction demo for MiMo Trust"
requires-python = ">=3.10"
dependencies = [
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "openai>=1.99,<2",
  "playwright>=1.61,<2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.1.29",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
